<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- rounded square background -->
  <rect width="32" height="32" rx="8" fill="#0E0E1A"/>

  <!-- [em] pixel-style text, centered -->
  <!-- [ bracket -->
  <rect x="4"  y="9"  width="2.5" height="14" fill="white"/>
  <rect x="4"  y="9"  width="5"   height="2"  fill="white"/>
  <rect x="4"  y="21" width="5"   height="2"  fill="white"/>

  <!-- e -->
  <rect x="11" y="13" width="5"   height="1.5" fill="white"/>
  <rect x="11" y="13" width="1.5" height="6"   fill="white"/>
  <rect x="11" y="15.5" width="4" height="1.5" fill="white"/>
  <rect x="11" y="19" width="5"   height="1.5" fill="white"/>
  <rect x="15" y="13" width="1.5" height="2.5" fill="white"/>

  <!-- m -->
  <rect x="18" y="13" width="1.5" height="7"   fill="white"/>
  <rect x="18" y="13" width="5"   height="1.5" fill="white"/>
  <rect x="21.5" y="13" width="1.5" height="7" fill="white"/>
  <rect x="24.5" y="13" width="1.5" height="7" fill="white"/>
  <rect x="21.5" y="13" width="3"   height="1.5" fill="white"/>

  <!-- ] bracket -->
  <rect x="27.5" y="9"  width="2.5" height="14" fill="white"/>
  <rect x="25.5" y="9"  width="5"   height="2"  fill="white"/>
  <rect x="25.5" y="21" width="5"   height="2"  fill="white"/>
</svg>
